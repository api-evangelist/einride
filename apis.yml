aid: einride
name: Einride
description: >-
  Einride is a Swedish freight technology company delivering an end-to-end platform for
  electric and autonomous road freight, combining purpose-built autonomous trucks, electric
  vehicles, smart charging, and the Saga operating software. Its developer-facing product,
  Einride Extend, exposes open, resource-oriented APIs (designed with Google AIP) over both
  gRPC and HTTP for booking truck tours and creating, releasing, and tracking shipments.
  The Extend APIs are alpha (v1beta1) and offered to select developers during an early-access
  phase, with a saga CLI, Buf Schema Registry proto module, and React UI component library.
  Einride serves customers including PepsiCo, Heineken, and DP World across Europe, the US,
  and the Middle East.
